name: VehereGo Android Release & AAB Build Workflow

on:
  workflow_run:
    workflows: ["VehereGo CI & Benchmark Test Workflow"]
    types:
      - completed
    branches:
      - master
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build AAB & Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Free Disk Space (Clean Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af 2>/dev/null || true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/veherego
          path: veherego
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract Dynamic Version from pubspec.yaml
        id: meta
        working-directory: ./veherego
        run: |
          BASE_VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.0.0"
          fi
          YEAR_DIGIT=$(date -u +"%y" | tail -c 2)
          TIME_PREFIX=$(date -u +"%m%d%H")
          BUILD_NUM="${YEAR_DIGIT}${TIME_PREFIX}$(( ${{ github.run_number }} % 10 ))"
          APP_VER="${BASE_VER}.${BUILD_NUM}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="test-${APP_VER}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_time=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "=========================================================================="
          echo "🏷️ [Release Version] 发布版本号: ${APP_VER}+${BUILD_NUM}"
          echo "=========================================================================="

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Deterministic Fixed Release Signing Key
        env:
          KEYSTORE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p veherego/android/app
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "$KEYSTORE_SECRET" | base64 -d > veherego/android/app/release_deterministic.jks
          else
            B64_KEY=""
            echo "$B64_KEY" | base64 -d > veherego/android/app/release_deterministic.jks
          fi

          cat << 'EOF' > veherego/android/key.properties
          keyAlias=veherego_release_key
          keyPassword=VehereGoStablePass2026
          storeFile=release_deterministic.jks
          storePassword=VehereGoStablePass2026
          EOF

      - name: Set up Flutter SDK 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Preprocess & Sync Latest Global Brands & Holidays
        working-directory: ./veherego
        run: |
          dart run tools/sync_simple_icons.dart
          dart run tools/sync_holiday_catalog.dart
          dart run tools/sync_l10n.dart

      - name: Install Dependencies
        run: |
          cd veherego
          flutter pub get
          flutter gen-l10n

      - name: Build Android App Bundle (AAB) & Signed Release APK
        run: |
          cd veherego
          echo "=========================================================================="
          echo "🛡️ 开始构建 Release APK & AAB (基于 YYMMDDHH+run_number 动态合规版本)..."
          echo "=========================================================================="
          flutter build appbundle --release --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation
          flutter build apk --release --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/veherego-v${{ env.APP_VERSION }}-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release_assets/veherego-v${{ env.APP_VERSION }}-release.aab
          cp build/app/outputs/flutter-apk/app-release.apk ../veherego-release-universal.apk
          echo "=========================================================================="
          echo "✅ 编译打包成功！版本号: ${{ env.APP_VERSION }} + ${{ env.APP_BUILD_NUMBER }}"
          echo "=========================================================================="

      - name: Publish Release to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Release v${{ env.APP_VERSION }} (Release Build)"
          body: |
            ## 正式发布版本 #${{ env.APP_BUILD_NUMBER }}
            - **版本号**: `${{ env.APP_VERSION }}`
            - **Build Number**: `${{ env.APP_BUILD_NUMBER }}`
            - **Commit**: ${{ github.sha }}
            - **打包产物**: `veherego-v${{ env.APP_VERSION }}-release.apk` / `veherego-v${{ env.APP_VERSION }}-release.aab` (统一固定签名，支持直装实机测试)
          draft: false
          prerelease: false
          files: ./veherego/release_assets/*.{apk,aab}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

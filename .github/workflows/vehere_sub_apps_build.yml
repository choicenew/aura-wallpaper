name: "[Vehere Sub-Apps] Build Perk Dock & Yijing Compass Test APK"

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: '选择需要编译的子应用 (all / perk_dock / yijing_compass)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - perk_dock
          - yijing_compass
  push:
    tags:
      - 'v-sub-*'

permissions:
  contents: write

jobs:
  build_perk_dock:
    name: Build Vehere Perk Dock (APK & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target_app == 'all' || github.event.inputs.target_app == 'perk_dock'

    steps:
      - name: Free Disk Space (Clean Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af 2>/dev/null || true

      - name: Checkout veherego Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/veherego
          path: veherego
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract Dynamic Version from pubspec.yaml
        id: meta
        working-directory: ./veherego/packages/vehere_perk_dock
        run: |
          if [ -f "pubspec.yaml" ]; then
            BASE_VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.0.0"
          fi
          YEAR_DIGIT=$(date -u +"%y" | tail -c 2)
          TIME_PREFIX=$(date -u +"%m%d%H")
          BUILD_NUM="${YEAR_DIGIT}${TIME_PREFIX}$(( ${{ github.run_number }} % 10 ))"
          APP_VER="${BASE_VER}.${BUILD_NUM}"
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "=========================================================================="
          echo "🏷️ [Vehere Perk Dock] 构建版本号: ${APP_VER}+${BUILD_NUM}"
          echo "=========================================================================="

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Deterministic Fixed Release Signing Key
        env:
          KEYSTORE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          TARGET_ANDROID_DIR="veherego/packages/vehere_perk_dock/android"
          mkdir -p ${TARGET_ANDROID_DIR}/app
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "$KEYSTORE_SECRET" | base64 -d > ${TARGET_ANDROID_DIR}/app/release_deterministic.jks
          else
            B64_KEY=""
            echo "$B64_KEY" | base64 -d > ${TARGET_ANDROID_DIR}/app/release_deterministic.jks
          fi

          cat << 'EOF' > ${TARGET_ANDROID_DIR}/key.properties
          keyAlias=veherego_release_key
          keyPassword=VehereGoStablePass2026
          storeFile=release_deterministic.jks
          storePassword=VehereGoStablePass2026
          EOF

      - name: Set up Flutter SDK 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./veherego/packages/vehere_perk_dock
        run: |
          flutter pub get

      - name: Build Debug & Signed Release APK
        working-directory: ./veherego/packages/vehere_perk_dock
        run: |
          echo "=========================================================================="
          echo "📦 开始编译 Vehere Perk Dock (Debug & Release APK)..."
          echo "=========================================================================="
          flutter build apk --debug --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }}
          flutter build apk --release --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation || true
          
          mkdir -p release_assets
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk release_assets/vehere_perk_dock-v${{ env.APP_VERSION }}-debug.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release_assets/vehere_perk_dock-v${{ env.APP_VERSION }}-release.apk
          fi
          ls -lh release_assets/

      - name: Upload Test APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vehere_perk_dock-build-outputs
          path: ./veherego/packages/vehere_perk_dock/release_assets/*.apk

      - name: Publish Test APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-vehere_perk_dock-v${{ env.APP_VERSION }}
          name: "Vehere Perk Dock Test Build v${{ env.APP_VERSION }}"
          body: |
            ## Vehere Perk Dock 独立测试构建 #${{ env.APP_BUILD_NUMBER }}
            - **应用**: `Vehere Perk Dock` (`vehere_perk_dock`)
            - **版本**: `${{ env.APP_VERSION }}`
            - **Commit**: ${{ github.sha }}
            - **产物**: 包含 Debug 与 Release 独立实机安装测试包。
          draft: false
          prerelease: true
          files: ./veherego/packages/vehere_perk_dock/release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  build_yijing_compass:
    name: Build Vehere Yijing Compass (APK & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target_app == 'all' || github.event.inputs.target_app == 'yijing_compass'

    steps:
      - name: Free Disk Space (Clean Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af 2>/dev/null || true

      - name: Checkout veherego Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/veherego
          path: veherego
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract Dynamic Version from pubspec.yaml
        id: meta
        working-directory: ./veherego/packages/vehere_yijing_compass
        run: |
          if [ -f "pubspec.yaml" ]; then
            BASE_VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.0.0"
          fi
          YEAR_DIGIT=$(date -u +"%y" | tail -c 2)
          TIME_PREFIX=$(date -u +"%m%d%H")
          BUILD_NUM="${YEAR_DIGIT}${TIME_PREFIX}$(( ${{ github.run_number }} % 10 ))"
          APP_VER="${BASE_VER}.${BUILD_NUM}"
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "=========================================================================="
          echo "🏷️ [Vehere Yijing Compass] 构建版本号: ${APP_VER}+${BUILD_NUM}"
          echo "=========================================================================="

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Deterministic Fixed Release Signing Key
        env:
          KEYSTORE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          TARGET_ANDROID_DIR="veherego/packages/vehere_yijing_compass/android"
          mkdir -p ${TARGET_ANDROID_DIR}/app
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "$KEYSTORE_SECRET" | base64 -d > ${TARGET_ANDROID_DIR}/app/release_deterministic.jks
          else
            B64_KEY=""
            echo "$B64_KEY" | base64 -d > ${TARGET_ANDROID_DIR}/app/release_deterministic.jks
          fi

          cat << 'EOF' > ${TARGET_ANDROID_DIR}/key.properties
          keyAlias=veherego_release_key
          keyPassword=VehereGoStablePass2026
          storeFile=release_deterministic.jks
          storePassword=VehereGoStablePass2026
          EOF

      - name: Set up Flutter SDK 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./veherego/packages/vehere_yijing_compass
        run: |
          flutter pub get

      - name: Build Debug & Signed Release APK
        working-directory: ./veherego/packages/vehere_yijing_compass
        run: |
          echo "=========================================================================="
          echo "📦 开始编译 Vehere Yijing Compass (Debug & Release APK)..."
          echo "=========================================================================="
          flutter build apk --debug --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }}
          flutter build apk --release --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation || true
          
          mkdir -p release_assets
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk release_assets/vehere_yijing_compass-v${{ env.APP_VERSION }}-debug.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release_assets/vehere_yijing_compass-v${{ env.APP_VERSION }}-release.apk
          fi
          ls -lh release_assets/

      - name: Upload Test APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vehere_yijing_compass-build-outputs
          path: ./veherego/packages/vehere_yijing_compass/release_assets/*.apk

      - name: Publish Test APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-vehere_yijing_compass-v${{ env.APP_VERSION }}
          name: "Vehere Yijing Compass Test Build v${{ env.APP_VERSION }}"
          body: |
            ## Vehere Yijing Compass 独立测试构建 #${{ env.APP_BUILD_NUMBER }}
            - **应用**: `Vehere Yijing Compass` (`vehere_yijing_compass`)
            - **版本**: `${{ env.APP_VERSION }}`
            - **Commit**: ${{ github.sha }}
            - **产物**: 包含 Debug 与 Release 独立实机安装测试包。
          draft: false
          prerelease: true
          files: ./veherego/packages/vehere_yijing_compass/release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

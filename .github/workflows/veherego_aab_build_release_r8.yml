name: "[VehereGo] Build Release (R8)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build R8 Obfuscated Release AAB & Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Free Disk Space (Clean Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af 2>/dev/null || true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/veherego
          path: veherego
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Locate Flutter Project
        run: |
          VEHEREGO_DIR=$(find veherego -type f -name pubspec.yaml -print0 | while IFS= read -r -d '' manifest; do
            project_dir=${manifest%/pubspec.yaml}
            if [ -d "$project_dir/android" ]; then
              printf '%s' "$project_dir"
              break
            fi
          done)
          if [ -z "$VEHEREGO_DIR" ]; then
            echo "Unable to locate the VehereGo Flutter project"
            exit 1
          fi
          echo "VEHEREGO_DIR=$VEHEREGO_DIR" >> "$GITHUB_ENV"

      - name: Extract Dynamic Version from pubspec.yaml
        id: meta
        working-directory: ${{ env.VEHEREGO_DIR }}
        run: |
          BASE_VER=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.0.0"
          fi
          YEAR_DIGIT=$(date -u +"%y" | tail -c 2)
          TIME_PREFIX=$(date -u +"%m%d%H")
          BUILD_NUM="${YEAR_DIGIT}${TIME_PREFIX}$(( ${{ github.run_number }} % 10 ))"
          APP_VER="${BASE_VER}.${BUILD_NUM}"
          echo "APP_VERSION=${APP_VER}" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV
          echo "COMMIT_MSG=$(git log -1 --format='%h - %s')" >> $GITHUB_ENV
          echo "🏷️ [Release Version] 发布版本号: ${APP_VER}+${BUILD_NUM}"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore and create key.properties
        run: |
          mkdir -p "$VEHEREGO_DIR/android/app"
          echo "${{ secrets.VEHEREGO_KEYSTORE_BASE64 }}" | base64 -d > "$VEHEREGO_DIR/android/app/key.jks"
          echo "storePassword=${{ secrets.VEHEREGO_KEYSTORE_PASSWORD }}" > "$VEHEREGO_DIR/android/key.properties"
          echo "keyPassword=${{ secrets.VEHEREGO_KEY_PASSWORD }}" >> "$VEHEREGO_DIR/android/key.properties"
          echo "keyAlias=${{ secrets.VEHEREGO_KEYSTORE_ALIAS }}" >> "$VEHEREGO_DIR/android/key.properties"
          echo "storeFile=key.jks" >> "$VEHEREGO_DIR/android/key.properties"

      - name: Set up Flutter SDK 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ${{ env.VEHEREGO_DIR }}
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Android App Bundle (AAB) & Signed Release APK with R8
        working-directory: ${{ env.VEHEREGO_DIR }}
        run: |
          flutter build appbundle --release --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation
          flutter build apk --release --no-tree-shake-icons --build-name="${{ env.APP_VERSION }}" --build-number=${{ env.APP_BUILD_NUMBER }} --android-skip-build-dependency-validation
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/veherego-v${{ env.APP_VERSION }}-release-r8.apk
          cp build/app/outputs/bundle/release/app-release.aab release_assets/veherego-v${{ env.APP_VERSION }}-release-r8.aab

      - name: Publish Release to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: veherego-v${{ env.APP_VERSION }}-release-r8
          name: "VehereGo Release v${{ env.APP_VERSION }} (R8 Obfuscated)"
          body: |
            ## VehereGo - 正式 Release 发布版本 v${{ env.APP_VERSION }}
            - **版本号**: `${{ env.APP_VERSION }}`
            - **Build Number**: `${{ env.APP_BUILD_NUMBER }}`
            - **Commit**: `${{ env.COMMIT_MSG }}`
            - **说明**: 经过 R8 混淆的正式 Release 打包产物。
          draft: false
          prerelease: false
          files: ${{ env.VEHEREGO_DIR }}/release_assets/*.{apk,aab}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
